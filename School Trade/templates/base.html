<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园二手交易平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">校园闲置交易</a>
        <ul class="navbar-nav ms-auto">
            {% if user.is_authenticated %}
                <li class="nav-item">
                    <span class="nav-link text-dark fw-bold">你好，{{ user.username }} 同学</span>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-success fw-bold" href="{% url 'product_create' %}">➕ 发布闲置</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-primary fw-bold" href="{% url 'profile' %}">👤 个人中心</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-secondary" href="{% url 'logout' %}">退出</a>
                </li>
            {% else %}
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'login' %}">登录</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link btn btn-primary text-white ms-2 px-3" href="{% url 'register' %}">注册新同学</a>
                </li>
            {% endif %}
        </ul>
    </div>
</nav>

<div class="container">
    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
