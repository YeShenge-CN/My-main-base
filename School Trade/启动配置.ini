# 校园二手交易平台 一键启动器 配置文件
# 全部为可选配置，删除本文件会使用默认值自动重建。

# 项目根目录（默认：启动器所在目录）
ProjectDir=

# Django 服务监听地址与端口
Host=127.0.0.1
Port=8080

# Python 解释器路径（默认自动查找 venv、.venv、env 或 PATH）
PythonPath=

# Django settings 模块（默认 campus_trade.settings）
SettingsModule=campus_trade.settings

# MySQL 连接信息与服务名（需与 campus_trade/settings.py 保持一致）
MySqlHost=127.0.0.1
MySqlPort=3306
MySqlService=MySQL97

# 启动时若 MySQL 未运行，是否自动启动（需要管理员权限，会弹 UAC）
AutoStartMySql=true
# 是否允许自动提权（弹 UAC 启动 MySQL 服务）
AutoElevate=true

# 启动前是否自动执行 manage.py migrate
AutoMigrate=true
# 服务就绪后是否自动打开浏览器
OpenBrowser=true
# 是否开启代码热重载（调试用，默认关闭更稳定）
Reload=false
# 出错时是否停留等待按键
WaitOnExit=true
